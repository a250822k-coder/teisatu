<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>偵察船 — 地球観測</title>
<style>
:root{--void:#02040c;--ice:#cfe6ff;--amber:#ffb86b;--dim:rgba(207,230,255,.55)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--void);color:var(--ice);overflow:hidden;
font:300 14px/1.6 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;letter-spacing:.06em}
#pano,#fx{position:fixed!important;inset:0;width:100%;height:100%}
#pano{z-index:0}#fx{z-index:2}
#fx{pointer-events:none;opacity:1}
#flash{position:fixed;inset:0;background:#e8f3ff;opacity:0;pointer-events:none;z-index:7}
body.idle{cursor:none}
.ui{transition:opacity .8s}
body.idle .ui{opacity:0;pointer-events:none}
button{font:inherit;letter-spacing:inherit;color:var(--ice);background:none;border:1px solid rgba(207,230,255,.25);
border-radius:99px;padding:.35em 1em;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:.4;z-index:5}
#bar:hover{opacity:1}
#bar button{background:rgba(2,6,16,.45);backdrop-filter:blur(6px)}
#hud{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:12px;z-index:4;
text-shadow:0 0 6px #000;font-variant-numeric:tabular-nums}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
padding:9vh 20px 13vh;pointer-events:none;z-index:3;text-align:center}
#intro h1{margin:0;font-weight:200;font-size:clamp(20px,3.2vw,34px);letter-spacing:.5em;padding-left:.5em}
#intro p{margin:.5em 0 0;color:var(--dim)}
#go{pointer-events:auto;width:120px;height:120px;border-radius:50%;border:1px solid var(--amber);color:var(--amber);
font-size:16px;letter-spacing:.3em;padding-left:.3em;box-shadow:0 0 40px rgba(255,184,107,.25),inset 0 0 30px rgba(255,184,107,.12)}
#go:hover{background:rgba(255,184,107,.12)}
.panel{position:fixed;right:14px;top:14px;bottom:70px;width:min(320px,calc(100% - 28px));overflow:auto;z-index:6;
background:rgba(2,6,16,.84);backdrop-filter:blur(10px);border:1px solid rgba(207,230,255,.15);border-radius:12px;padding:16px}
.panel h2{margin:0 0 12px;font-weight:300;font-size:15px}
.panel label{display:block;margin:14px 0 2px;color:var(--dim);font-size:12px}
.panel input[type=range],.panel select{width:100%;accent-color:var(--amber)}
.panel select{background:#050a18;color:var(--ice);border:1px solid rgba(207,230,255,.25);border-radius:6px;padding:5px}
#place,#hud{background:rgba(2,6,16,.58);backdrop-filter:blur(6px);border:1px solid rgba(207,230,255,.2);border-radius:99px;padding:.3em 1.1em}
#place{color:#f0f7ff}#hud{color:rgba(225,238,255,.9)}#place:empty,#hud:empty{display:none}
#lm{position:fixed;top:38%;transform:translate(-50%,-50%);z-index:4;cursor:pointer;transition:opacity .8s}
body.idle #lm{opacity:.5}
.lmBox{position:relative;display:flex;align-items:center;gap:8px;max-width:260px;padding:5px 12px;border:1px solid rgba(255,184,107,.75);background:rgba(2,6,16,.55);backdrop-filter:blur(6px)}
.lmBox::after{content:"";position:absolute;left:50%;top:100%;height:34px;border-left:1px solid rgba(255,184,107,.75)}
#lm.off .lmBox::after{display:none}
.lmT{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.lmT small{color:var(--amber);font-size:9px;letter-spacing:.35em}
.lmT b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 6px #000}
.lmT span{font-size:11px;color:var(--dim)}
.a{font-style:normal;color:var(--amber);display:none;font-size:11px}
#lm.off[data-side=l] .a.l,#lm.off[data-side=r] .a.r{display:block}
.card{position:fixed;right:14px;bottom:70px;width:min(320px,calc(100% - 28px));max-height:70vh;overflow:auto;z-index:6;background:rgba(2,6,16,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,184,107,.4);border-radius:12px;padding:14px}
.card img{width:100%;max-height:150px;object-fit:cover;border-radius:8px}
.card h2{margin:10px 0 6px;font-weight:400;font-size:16px}.card p{margin:0 0 10px;font-size:13px;color:#dbe9ff}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card a{color:var(--ice);border:1px solid rgba(207,230,255,.25);border-radius:99px;padding:.3em 1em;text-decoration:none}
.card small{display:block;margin-top:8px;color:var(--dim);font-size:11px}
.panel .chk{display:flex;gap:8px;align-items:center;color:var(--ice);font-size:13px}.panel .chk input{accent-color:var(--amber)}
.tools{display:flex;gap:6px;margin-bottom:8px}.tools button{font-size:12px;padding:.15em .8em}
.item b{display:block;font-weight:400;font-size:13px}.item .sub{display:block;color:var(--dim)}
.item input{width:100%;margin-top:6px;background:#050a18;color:var(--ice);border:1px solid rgba(207,230,255,.25);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px}
.item{border-top:1px solid rgba(207,230,255,.12);padding:10px 0;font-size:12px}
.item div{display:flex;gap:6px;margin-top:6px}.item button{font-size:12px;padding:.15em .8em}
.item a{color:var(--ice);border:1px solid rgba(207,230,255,.25);border-radius:99px;padding:.15em .8em;text-decoration:none}
#place{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:rgba(207,230,255,.6);font-size:15px;letter-spacing:.3em;padding-left:.3em;text-shadow:0 0 8px #000;z-index:4;pointer-events:none;text-align:center;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(2,6,16,.8);border:1px solid rgba(255,184,107,.5);
padding:.5em 1.4em;border-radius:99px;opacity:0;transition:opacity .5s;pointer-events:none;z-index:9;color:var(--amber)}
#key{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void);z-index:10;padding:20px}
#key div{max-width:460px}#key h1{font-weight:200;letter-spacing:.4em;font-size:22px;margin:0 0 1em}
#key input{width:100%;margin:12px 0;padding:.6em 1em;background:#050a18;border:1px solid rgba(207,230,255,.3);
border-radius:8px;color:var(--ice);font:inherit}
#key small{color:var(--dim);display:block;margin-top:14px}#err{color:#ff8a7a;min-height:1.6em}
</style>
</head>
<body>
<div id="pano"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="intro" hidden>
  <div><h1>偵察船</h1><p>ワープして、地球のどこかへ。</p></div>
  <button id="go">ワープ</button>
</div>

<div id="place" class="ui"></div>
<div id="lm" hidden><div class="lmBox"><i class="a l">◀</i><div class="lmT"><small>LANDMARK</small><b id="lmN"></b><span id="lmD"></span></div><i class="a r">▶</i></div></div>
<section id="lmCard" class="card" hidden><img id="cImg" alt=""><h2 id="cT"></h2><p id="cTx"></p>
<div class="row"><button id="cNext">次の候補</button><a id="cA" target="_blank" rel="noopener">Wikipediaで読む</a><button id="cClose">閉じる</button></div>
<small>出典: Wikipedia（CC BY-SA）。位置は方向の目安で、建物の陰になる場合もあります。</small></section>
<div id="hud" class="ui"></div>
<div id="bar" class="ui" hidden>
  <button id="bWarp">ワープ (W)</button><button id="bPause">一時停止 (Space)</button><button id="bSave">保存 (S)</button><button id="bList">記録</button>
  <button id="bLm">ランドマーク (L)</button><button id="bSet">設定</button><button id="bSnd">音 (M)</button><button id="bFs">全画面 (F)</button>
</div>

<section id="pSet" class="panel" hidden>
  <h2>設定</h2>
  <label>1か所での滞在時間：<span id="vMin"></span> 分</label>
  <input id="rMin" type="range" min="1" max="30" step="1">
  <label>移動の速さ</label>
  <select id="sStep"><option value="8">とてもゆっくり</option><option value="5">ゆっくり</option><option value="3">ふつう</option></select>
  <label>1日の着地回数の上限：<span id="vLim"></span> 回（今日 <span id="vUse"></span> 回）</label>
  <input id="rLim" type="range" min="10" max="500" step="10">
  <label class="chk"><input type="checkbox" id="cPlace"> 画面上部に地名を表示する</label>
  <label class="chk"><input type="checkbox" id="cLand"> 近くのランドマークを表示する</label>
  <label>全体の音量</label><input type="range" data-vol="master" min="0" max="100">
  <label>環境音の音量</label><input type="range" data-vol="env" min="0" max="100">
  <label>BGMの音量</label><input type="range" data-vol="bgm" min="0" max="100">
  <label>ワープ音の音量（離すと試聴）</label><input type="range" data-vol="warp" min="0" max="100">
  <label class="chk"><input type="checkbox" id="cAwake"> 画面を消灯させない</label>
  <label>Google Maps APIキー</label>
  <button id="bKey">キーを変更する</button>
</section>
<section id="pList" class="panel" hidden>
  <h2>保存した地点</h2>
  <div class="tools"><button id="bExp">書き出し</button><button id="bImp">読み込み</button><input type="file" id="fImp" accept=".json,application/json" hidden></div><div id="list"></div>
</section>

<div id="toast"></div>

<div id="key">
  <div>
    <h1>偵察船</h1>
    <p>Google Maps JavaScript API のキーを入力してください。キーはこのブラウザにだけ保存されます。</p>
    <input id="kIn" type="password" placeholder="AIza…" autocomplete="off">
    <button id="kOk">起動する</button>
    <div id="err"></div>
    <small>Google Cloud コンソールで「Maps JavaScript API」を有効にし、請求先アカウントを設定したキーが必要です。</small>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),K='scout.key',SK='scout.saves',CK='scout.cfg';
const rnd=(a,b)=>a+Math.random()*(b-a),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ad=(a,b)=>((a-b+540)%360)-180;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=Object.assign({min:7,step:5,sound:true,limit:150,place:true,land:true,vol:{master:.7,env:.8,bgm:.8,warp:.35}},load(CK,{})),saves=load(SK,[]);
const today=()=>new Date().toLocaleDateString('sv');
function usage(){const u=load('scout.usage',{});return u.d===today()?u:{d:today(),n:0}}
function bump(){const u=usage();u.n++;store('scout.usage',u);return u.n}
function overLimit(){
  if(usage().n<cfg.limit)return false;
  toast(`今日の着地回数の上限（${cfg.limit}回）に達しました。明日また出発できます`);return true;
}
let paused=false,pauseAt=0,wl=null;
let sv,pano,ready=false,state='space',fxOn=true,showEarth=true,wt0=0,dir=0,visited=new Set(),stuck=0;
let nextStep=0,endAt=0,interact=-1e9,lastLat=0,lt=0,hudT=0,idleT;

const CITIES=[[35.68,139.76],[35.01,135.77],[43.06,141.35],[26.2,127.68],[37.57,126.98],[25.03,121.56],[13.75,100.5],[1.35,103.82],
[-6.2,106.8],[14.6,120.98],[21.03,105.85],[28.6,77.2],[42.87,74.59],[47.9,106.9],[41.7,44.8],[41.0,28.97],[25.2,55.27],
[-33.92,18.42],[-1.29,36.82],[-22.57,17.08],[-19.98,23.4],[48.86,2.35],[41.9,12.5],[46.6,8.0],[38.72,-9.14],[40.4,-3.7],
[51.5,-0.12],[52.2,21.0],[59.9,10.75],[64.15,-21.94],[62.0,-6.8],[40.7,-74.0],[41.5,-95.0],[38.6,-109.5],[49.28,-123.12],
[61.2,-149.9],[21.3,-157.86],[19.43,-99.13],[-12.05,-77.04],[-34.6,-58.38],[-22.9,-43.2],[-33.45,-70.67],[-50.3,-72.3],
[-33.87,151.2],[-31.95,115.86],[-36.85,174.76]];

/* ---------- 宇宙・ワープ描画 ---------- */
const fx=$('#fx'),c=fx.getContext('2d');
const rs=()=>{fx.width=innerWidth;fx.height=innerHeight};addEventListener('resize',rs);rs();
const ST=[...Array(520)].map(()=>({x:rnd(-1,1),y:rnd(-1,1),z:rnd(.08,1)}));
const BL=[...Array(18)].map(()=>({lo:rnd(0,6.28),la:rnd(-1.1,1.1),s:rnd(.07,.2),c:Math.random()<.7?'#3f7a45':'#9a8a58'}));
function earth(t,cx,cy,R,a){
  c.save();c.globalAlpha=a;c.beginPath();c.arc(cx,cy,R,0,7);c.clip();
  let g=c.createRadialGradient(cx-R*.3,cy-R*.3,R*.1,cx,cy,R);g.addColorStop(0,'#3b84c6');g.addColorStop(1,'#08284a');
  c.fillStyle=g;c.fillRect(cx-R,cy-R,2*R,2*R);
  for(const b of BL){const l=b.lo+t/40000,v=Math.cos(b.la)*Math.cos(l);if(v<=0)continue;
    c.fillStyle=b.c;c.beginPath();c.ellipse(cx+R*Math.cos(b.la)*Math.sin(l),cy-R*Math.sin(b.la),R*b.s*v,R*b.s*1.1,0,0,7);c.fill()}
  g=c.createRadialGradient(cx-R*.5,cy-R*.4,R*.4,cx+R*.2,cy,R*1.25);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,10,.85)');
  c.fillStyle=g;c.fillRect(cx-R,cy-R,2*R,2*R);c.restore();
  c.save();c.globalAlpha=a;c.strokeStyle='rgba(120,190,255,.35)';c.lineWidth=R*.04;c.shadowColor='#6bb8ff';c.shadowBlur=R*.2;
  c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();c.restore();
}
function draw(t,dt){
  const w=fx.width,h=fx.height,warp=state==='warp',el=Math.max(0,t-wt0),p=warp?Math.min(1,el/3000):0;
  const ramp=!warp||showEarth?1:Math.min(1,el/700);
  const sp=warp?(.0008+Math.pow(p,2.5)*.045)*dt/16:0,TL=warp?.015+p*.3:0;
  c.clearRect(0,0,w,h);c.fillStyle=`rgba(2,4,12,${ramp})`;c.fillRect(0,0,w,h);
  for(const s of ST){
    const pz=Math.min(s.z+TL,4),px=s.x/pz*w/2+w/2,py=s.y/pz*h/2+h/2;
    s.z-=sp;if(!(s.z>.03)){s.z=1;s.x=rnd(-1,1);s.y=rnd(-1,1)}
    const X=s.x/s.z*w/2+w/2,Y=s.y/s.z*h/2+h/2,k=1-s.z;
    if(X<0||X>w||Y<0||Y>h)continue;
    if(warp){c.strokeStyle=`rgba(${190+60*p|0},${220-20*p|0},255,${.35+.65*k})`;c.lineWidth=.8+k*2.2*(1+p);
      c.beginPath();c.moveTo(px,py);c.lineTo(X,Y);c.stroke()}
    else{c.fillStyle=`rgba(210,230,255,${.25+.7*k})`;c.fillRect(X,Y,.6+k*1.6,.6+k*1.6)}
  }
  if(showEarth){const R=Math.min(w,h)*.27*(1+p*1.2);earth(t,w/2,h*.46,R,Math.max(0,1-p*1.6))}
  if(warp&&p>.55){const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.hypot(w,h)/2);
    g.addColorStop(0,`rgba(255,200,140,${.5*(p-.55)})`);g.addColorStop(1,'rgba(255,200,140,0)');c.fillStyle=g;c.fillRect(0,0,w,h)}
}

/* ---------- Street View ---------- */
function loadMaps(key){
  window.__init=()=>{
    sv=new google.maps.StreetViewService();
    pano=new google.maps.StreetViewPanorama($('#pano'),{visible:false,disableDefaultUI:true,clickToGo:false,linksControl:false,
      addressControl:false,fullscreenControl:false,zoomControl:false,panControl:false,motionTracking:false,motionTrackingControl:false,
      enableCloseButton:false,showRoadLabels:false,scrollwheel:false});
    ready=true;$('#key').hidden=true;$('#intro').hidden=false;$('#bar').hidden=false;
  };
  window.gm_authFailure=()=>keyErr('キーが認証されませんでした。キーとAPIの有効化を確認してください。');
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&language=ja&callback=__init`;
  s.onerror=()=>keyErr('Google Maps を読み込めませんでした。ネットワークを確認してください。');
  document.head.append(s);
}
function keyErr(m){localStorage.removeItem(K);$('#err').textContent=m;$('#key').hidden=false}
async function find(){
  for(let i=0;i<40;i++){
    const ct=Math.random()<.8?CITIES[Math.random()*CITIES.length|0]:null;
    const lat=ct?ct[0]+rnd(-1.5,1.5):rnd(-55,68),lng=ct?ct[1]+rnd(-1.5,1.5):rnd(-180,180);
    try{
      const r=await sv.getPanorama({location:{lat,lng},radius:ct?30000:200000,
        preference:google.maps.StreetViewPreference.NEAREST,source:google.maps.StreetViewSource.OUTDOOR});
      const d=r.data;
      if(d&&d.location&&d.location.pano&&/Google/.test(d.copyright||''))return{id:d.location.pano,lat:d.location.latLng.lat()};
    }catch(e){}
  }
  return null;
}
function arrive(id,heading,lat){
  paused=false;syncPause();keepAwake();
  visited=new Set([id]);stuck=0;
  const n=bump();if(n===Math.ceil(cfg.limit*.8))toast(`今日の着地回数が上限の80%（${n}/${cfg.limit}）に達しました`);
  pano.setPano(id);pano.setVisible(true);
  dir=heading??rnd(0,360);pano.setPov({heading:dir,pitch:2});
  const now=performance.now();nextStep=now+3500;endAt=now+cfg.min*60000;lastLat=lat;
  setTheme(lat);place();LM={list:[],i:0,key:''};landmarks();lastGeo=performance.now();state='cruise';showEarth=false;
  fx.style.opacity=0;fxOn=false;$('#intro').hidden=true;
}
async function warp(){
  if(!ready||state==='warp')return;
  if(overLimit()){if(state==='cruise')endAt=Infinity;return}
  audioInit();whoosh();paused=false;syncPause();keepAwake();
  const fromSpace=state==='space';showEarth=fromSpace;
  state='warp';fxOn=true;wt0=performance.now();
  fx.style.transition='none';fx.style.opacity=1;$('#place').textContent='';$('#lm').hidden=true;
  $('#intro').hidden=true;closePanels();
  const [r]=await Promise.all([find(),sleep(3200)]);
  if(!r){toast('着地できる地点が見つかりませんでした。もう一度ワープしてください');state='space';showEarth=true;$('#intro').hidden=false;return}
  const fl=$('#flash');fl.style.transition='opacity .25s';fl.style.opacity=1;await sleep(300);
  fx.style.transition='none';arrive(r.id,null,r.lat);
  await sleep(50);fl.style.transition='opacity 1.8s';fl.style.opacity=0;
}
let geo,lastGeo=0,geoWarned=false;
async function place(){
  if(!cfg.place||!pano)return;const pos=pano.getPosition();if(!pos)return;
  try{
    geo=geo||new google.maps.Geocoder();const r=await geo.geocode({location:pos}),m={};
    for(const x of r.results)for(const a of x.address_components)for(const ty of a.types)if(!m[ty])m[ty]=a.long_name;
    const parts=[...new Set([m.country,m.administrative_area_level_1,m.locality||m.administrative_area_level_2||m.sublocality_level_1].filter(Boolean))];
    $('#place').textContent=parts.length?parts.join('　'):'未知の領域';
  }catch(e){if(!geoWarned){geoWarned=true;toast('地名を取得できません。APIキーの制限でGeocoding APIを許可してください')}$('#place').textContent=''}
}
function step(t){
  const L=(pano.getLinks()||[]).filter(l=>!visited.has(l.pano));
  let best=null,bd=999;
  for(const l of L){const d=Math.abs(ad(l.heading,dir));if(d<bd){bd=d;best=l}}
  if(!best||bd>100){if(++stuck>3){warp();return}nextStep=t+1000;return}
  stuck=0;visited.add(best.pano);dir=best.heading;pano.setPano(best.pano);nextStep=t+cfg.step*1000;
}
function cam(t,dt){
  if(t-interact<8000)return;
  const p=pano.getPov(),target=dir+22*Math.sin(t/6500);
  p.heading+=ad(target,p.heading)*(1-Math.exp(-dt/1800));
  p.pitch+=(3+4*Math.sin(t/9000)-p.pitch)*(1-Math.exp(-dt/2000));
  pano.setPov(p);
}
function hud(t){
  if(t-hudT<500)return;hudT=t;
  const rem=Math.max(0,(endAt-t)/1000|0),pos=pano.getPosition(),u=usage();
  const head=paused?'一時停止中':endAt===Infinity?'今日の上限に達しました':`次のワープまで ${rem/60|0}:${String(rem%60).padStart(2,'0')}`;
  $('#hud').textContent=head+`　今日 ${u.n}/${cfg.limit}回`+(pos?`　${pos.lat().toFixed(3)}, ${pos.lng().toFixed(3)}`:'');
}
function loop(t){
  const dt=Math.min(100,t-lt);lt=t;
  if(fxOn)draw(t,dt);
  if(state==='cruise'&&ready){if(!paused&&t>nextStep)step(t);if(t-lastGeo>40000){lastGeo=t;place();landmarks()}lmUpdate(t);if(!paused&&t>endAt)warp();cam(t,dt);hud(t)}
  requestAnimationFrame(loop);
}
$('#pano').addEventListener('pointerdown',()=>interact=performance.now());
$('#pano').addEventListener('wheel',()=>interact=performance.now());

/* ---------- 保存 ---------- */
function syncPause(){$('#bPause').textContent=paused?'再開 (Space)':'一時停止 (Space)'}
function togglePause(){
  if(state!=='cruise')return;
  const n=performance.now();
  if(!paused){paused=true;pauseAt=n}
  else{const d=n-pauseAt;if(isFinite(endAt))endAt+=d;nextStep+=d;paused=false}
  syncPause();ok(paused?'一時停止しました':'再開しました');
}
/* ---------- 画面の消灯防止 ---------- */
async function keepAwake(){
  if(!cfg.awake||wl||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){wl=null}
}
function freeAwake(){if(wl){wl.release().catch(()=>{});wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
function save(){
  if(state!=='cruise'){toast('地球に降りてから保存できます');return}
  const p=pano.getPosition(),lm=LM.list[LM.i];
  saves.unshift({pano:pano.getPano(),lat:p.lat(),lng:p.lng(),h:pano.getPov().heading,t:Date.now(),
    place:$('#place').textContent||'',lm:lm?lm.title:'',memo:''});
  store(SK,saves);renderList();toast('この地点を保存しました。「記録」でメモを追加できます');
}
async function jump(s){
  if(overLimit())return;
  const R={source:google.maps.StreetViewSource.OUTDOOR};let id=null;
  try{const r=await sv.getPanorama({pano:s.pano});id=r.data.location.pano}catch(e){}
  if(!id)try{const r=await sv.getPanorama({location:{lat:s.lat,lng:s.lng},radius:300,...R});id=r.data.location.pano}catch(e){}
  if(!id){toast('この地点の景色を読み込めませんでした');return}
  arrive(id,s.h,s.lat);closePanels();
}
function renderList(){
  const el=$('#list');el.textContent='';
  if(!saves.length){el.textContent='まだ保存した地点はありません。気に入った景色で「保存」を押してください。';return}
  saves.forEach((s,i)=>{
    const d=document.createElement('div'),t=document.createElement('b'),sub=document.createElement('span'),m=document.createElement('input'),row=document.createElement('div');
    d.className='item';t.textContent=s.place||`${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}`;
    sub.className='sub';sub.textContent=[s.lm&&`近く：${s.lm}`,new Date(s.t).toLocaleString('ja-JP')].filter(Boolean).join('　');
    m.placeholder='メモ（例：夕焼けがきれい）';m.maxLength=300;m.value=s.memo||'';
    m.onchange=()=>{s.memo=m.value;store(SK,saves);ok('メモを保存しました')};
    const go=document.createElement('button');go.textContent='ここへ移動';go.onclick=()=>jump(s);
    const a=document.createElement('a');a.textContent='地図で開く';a.target='_blank';a.rel='noopener';
    a.href=`https://www.google.com/maps/@?api=1&map_action=pano&pano=${encodeURIComponent(s.pano)}`;
    const x=document.createElement('button');x.textContent='削除';
    x.onclick=()=>{saves.splice(i,1);store(SK,saves);renderList()};
    row.append(go,a,x);d.append(t,sub,m,row);el.append(d);
  });
}
function exportSaves(){
  if(!saves.length){toast('書き出す地点がありません');return}
  const b=new Blob([JSON.stringify({app:'scout',v:1,saves},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`scout-saves-${today()}.json`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);ok('記録を書き出しました');
}
function importSaves(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.saves;let n=0;
    for(const x of arr||[]){
      if(!x||typeof x.pano!=='string'||!isFinite(x.lat)||!isFinite(x.lng))continue;
      if(saves.some(y=>y.pano===x.pano&&y.t===x.t))continue;
      saves.push({pano:x.pano,lat:+x.lat,lng:+x.lng,h:+x.h||0,t:+x.t||Date.now(),
        place:String(x.place||'').slice(0,100),lm:String(x.lm||'').slice(0,100),memo:String(x.memo||'').slice(0,300)});n++;
    }
    saves.sort((a,b)=>b.t-a.t);store(SK,saves);renderList();ok(`${n} 件を読み込みました`);
  }catch(e){toast('読み込めないファイルです')}};
  r.readAsText(file);
}

/* ---------- 音（Web Audioで生成） ---------- */
let AC,master,bus={},AL={},TH=null,style=0,nbuf,tk=0;
const THEMES={polar:{f:450,w:.5,sc:[220,246.9,329.6,392,440],root:110,bird:0},
  tropic:{f:950,w:.12,sc:[293.7,330,370,440,494,587],root:146.8,bird:1},
  temperate:{f:700,w:.18,sc:[261.6,293.7,329.6,392,440,523],root:130.8,bird:.45}};
function noise(){const s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;s.start();return s}
function applyVol(){
  if(!AC)return;const v=cfg.vol,t=AC.currentTime;
  master.gain.setTargetAtTime(cfg.sound?v.master:0,t,.1);
  bus.env.gain.setTargetAtTime(v.env,t,.1);bus.bgm.gain.setTargetAtTime(v.bgm,t,.1);bus.sfx.gain.setTargetAtTime(v.warp,t,.1);
}
function audioInit(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.connect(AC.destination);
  for(const k of['env','bgm','sfx']){bus[k]=AC.createGain();bus[k].connect(master)}
  applyVol();
  nbuf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const lay=(f,type,q)=>{const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
    const g=AC.createGain();g.gain.value=0;noise().connect(fl);fl.connect(g);g.connect(bus.env);return{fl,g}};
  const w=lay(700,'bandpass',.7),r=lay(2500,'highpass',.5),v=lay(600,'lowpass',.5);
  AL={bp:w.fl,wind:w.g,rain:r.g,waves:v.g};
  const lfo=(rate,depth,target)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=rate;g.gain.value=depth;o.connect(g);g.connect(target);o.start()};
  lfo(.07,.05,AL.wind.gain);lfo(.1,.06,AL.waves.gain);
  const io=AC.createOscillator(),ig=AC.createGain();io.frequency.value=4300;ig.gain.value=0;io.connect(ig);ig.connect(bus.env);io.start();AL.ins=ig;lfo(13,.003,ig.gain);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;const dg=AC.createGain();dg.gain.value=.035;lp.connect(dg);dg.connect(bus.bgm);
  AL.drone=[0,1].map(i=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=130.8*(i?1.5:1);o.detune.value=i?4:-4;o.connect(lp);o.start();return o});
  setInterval(bgm,1200);(function bird(){if(state==='cruise')chirp();setTimeout(bird,rnd(2500,7000))})();
}
function setTheme(lat){
  const a=Math.abs(lat);TH=a>55?THEMES.polar:a<23?THEMES.tropic:THEMES.temperate;style=Math.random()*3|0;
  if(!AC)return;const t=AC.currentTime,tc=3;
  const rain=Math.random()<.15,sea=TH!==THEMES.polar&&Math.random()<.3;
  AL.bp.frequency.setTargetAtTime(TH.f,t,tc);AL.wind.gain.setTargetAtTime(TH.w,t,tc);
  AL.rain.gain.setTargetAtTime(rain?.1:0,t,tc);AL.waves.gain.setTargetAtTime(sea?.16:0,t,tc);
  AL.ins.gain.setTargetAtTime(TH===THEMES.tropic?.005:TH===THEMES.temperate&&Math.random()<.5?.003:0,t,tc);
  AL.drone[0].frequency.setTargetAtTime(TH.root,t,4);AL.drone[1].frequency.setTargetAtTime(TH.root*1.5,t,4);
}
function tone(f,a,att,dec,type){
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+att+dec);
  o.connect(g);g.connect(bus.bgm);o.start(t);o.stop(t+att+dec+.1);
}
function bgm(){
  if(!AC||!TH||state==='space')return;tk++;const S=TH.sc;
  if(style===0){if(tk%3===0&&Math.random()>.2)tone(S[Math.random()*S.length|0],.05,2,6)}
  else if(style===1){if(Math.random()>.15)tone(S[tk%S.length]*(Math.random()<.3?2:1),.035,.01,1.4,'triangle')}
  else if(tk%4===0){const f=S[Math.random()*S.length|0];tone(f,.04,.02,6);tone(f*2.76,.012,.02,3)}
}
function chirp(){
  if(!AC||!TH||Math.random()>TH.bird)return;
  const base=rnd(2400,4200),n=2+(Math.random()*3|0);
  for(let i=0;i<n;i++){
    const t=AC.currentTime+i*.14,o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*1.4,t+.09);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.02);g.gain.linearRampToValueAtTime(0,t+.11);
    o.connect(g);g.connect(bus.env);o.start(t);o.stop(t+.12);
  }
}
function whoosh(){
  if(!AC)return;const t=AC.currentTime,n=noise(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(150,t);f.frequency.exponentialRampToValueAtTime(4500,t+3);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+2.8);g.gain.linearRampToValueAtTime(0,t+3.4);
  n.connect(f);f.connect(g);g.connect(bus.sfx);n.stop(t+3.5);
  const o=AC.createOscillator(),og=AC.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(420,t+3);
  og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(.08,t+2.8);og.gain.linearRampToValueAtTime(0,t+3.4);
  o.connect(og);og.connect(bus.sfx);o.start(t);o.stop(t+3.5);
}
function toggleSound(){cfg.sound=!cfg.sound;store(CK,cfg);audioInit();applyVol();ok(cfg.sound?'音：オン':'音：オフ')}

/* ---------- UI ---------- */
function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,ms)}
const ok=m=>toast('✓ '+m,1400);
function closePanels(){$('#pSet').hidden=$('#pList').hidden=$('#lmCard').hidden=true}
function toggle(id){$('#vUse').textContent=usage().n;const p=$(id),o=p.hidden;closePanels();p.hidden=!o}
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{if($('#pSet').hidden&&$('#pList').hidden&&$('#lmCard').hidden)document.body.classList.add('idle')},3000)}
['mousemove','pointerdown','touchstart','keydown'].forEach(e=>addEventListener(e,wake,{passive:true}));wake();
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
$('#go').onclick=warp;$('#bWarp').onclick=warp;$('#bSave').onclick=save;$('#bFs').onclick=fs;$('#bSnd').onclick=toggleSound;
$('#bList').onclick=()=>toggle('#pList');$('#bSet').onclick=()=>toggle('#pSet');
$('#bKey').onclick=()=>{$('#key').hidden=false;$('#kIn').value=''};
$('#rMin').value=cfg.min;$('#vMin').textContent=cfg.min;$('#sStep').value=cfg.step;
$('#rMin').oninput=e=>{const v=+e.target.value;if(state==='cruise'&&isFinite(endAt))endAt+=(v-cfg.min)*60000;cfg.min=v;$('#vMin').textContent=v;store(CK,cfg)};
$('#rMin').onchange=()=>ok(`滞在時間を ${cfg.min} 分にしました`);
$('#rLim').value=cfg.limit;$('#vLim').textContent=cfg.limit;$('#vUse').textContent=usage().n;
$('#rLim').oninput=e=>{cfg.limit=+e.target.value;$('#vLim').textContent=cfg.limit;store(CK,cfg)};
$('#rLim').onchange=()=>ok(`1日の上限を ${cfg.limit} 回にしました`);
$('#sStep').onchange=e=>{cfg.step=+e.target.value;store(CK,cfg);ok(`移動の速さを「${e.target.selectedOptions[0].text}」にしました`)};
$('#cPlace').checked=cfg.place;$('#place').hidden=!cfg.place;
$('#cPlace').onchange=e=>{cfg.place=e.target.checked;store(CK,cfg);$('#place').hidden=!cfg.place;if(cfg.place&&state==='cruise')place();ok(cfg.place?'地名を表示します':'地名を非表示にしました')};
const VN={master:'全体の音量',env:'環境音の音量',bgm:'BGMの音量',warp:'ワープ音の音量'};
document.querySelectorAll('[data-vol]').forEach(el=>{
  const k=el.dataset.vol;el.value=Math.round(cfg.vol[k]*100);
  el.oninput=()=>{cfg.vol[k]=el.value/100;store(CK,cfg);applyVol()};
  el.onchange=()=>{ok(`${VN[k]}を ${el.value}% にしました`);if(k==='warp'){audioInit();whoosh()}};
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='w')warp();else if(k==='s')save();else if(k==='f')fs();else if(k==='m')toggleSound();else if(k==='l')setLand(!cfg.land);else if(e.key===' '){e.preventDefault();togglePause()}else if(k==='escape')closePanels();
});
function boot(){const v=$('#kIn').value.trim();if(!v)return;try{localStorage.setItem(K,v)}catch(e){}
  if(ready){location.reload();return}$('#err').textContent='';loadMaps(v)}
$('#kOk').onclick=boot;$('#kIn').onkeydown=e=>{if(e.key==='Enter')boot()};
/* ---------- 近くのランドマーク（Wikipedia） ---------- */
let LM={list:[],i:0,key:''},lmReq=0;
const BAD=/駅|学校|小学|中学|高校|交差点|バス停|郵便局|支店|警察|消防|病院|医院|クリニック|変電所|Station|School|Elementary|High School|Post Office|Hospital|Clinic/i;
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742e3*Math.asin(Math.sqrt(x))};
async function landmarks(){
  if(!cfg.land||!pano)return;const pos=pano.getPosition();if(!pos)return;
  const tag=++lmReq,la=pos.lat(),ln=pos.lng();
  for(const lang of['ja','en'])for(const rad of[2500,9000]){
    let list=[];
    try{
      const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${encodeURIComponent(la+'|'+ln)}&ggsradius=${rad}&ggslimit=50&prop=pageimages|extracts|coordinates&piprop=thumbnail&pithumbsize=320&pilimit=max&exintro=1&explaintext=1&exchars=420&exlimit=max`;
      const j=await(await fetch(u)).json();
      list=Object.values(j.query?.pages||{}).filter(p=>p.coordinates&&!BAD.test(p.title)).map(p=>{
        const c=p.coordinates[0],d=hav(la,ln,c.lat,c.lon),ex=p.extract||'';
        return{id:p.pageid,title:p.title,extract:ex,img:p.thumbnail&&p.thumbnail.source,lat:c.lat,lng:c.lon,lang,d,sc:(p.thumbnail?3:0)+Math.min(ex.length/140,3)-d/rad*2};
      });
    }catch(e){}
    if(tag!==lmReq)return;
    list=list.filter(x=>x.img||x.extract.length>120).sort((a,b)=>b.sc-a.sc).slice(0,5);
    if(list.length){const cur=LM.list[LM.i],k=cur?list.findIndex(x=>x.id===cur.id):-1;LM.list=list;LM.i=Math.max(0,k);LM.key='';return}
  }
  LM.list=[];
}
function lmUpdate(t){
  const el=$('#lm'),m=LM.list[LM.i],pos=pano&&pano.getPosition();
  if(!cfg.land||!m||!pos||state!=='cruise'){el.hidden=true;return}
  el.hidden=false;
  if(LM.key!==m.id){LM.key=m.id;$('#lmN').textContent=m.title}
  const r=Math.PI/180,la1=pos.lat()*r,la2=m.lat*r,dl=(m.lng-pos.lng())*r;
  const brg=Math.atan2(Math.sin(dl)*Math.cos(la2),Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl))/r;
  const rel=ad(brg,pano.getPov().heading),vis=Math.abs(rel)<42,d=hav(pos.lat(),pos.lng(),m.lat,m.lng);
  el.style.left=(vis?50+rel/96*100:rel>0?92:8)+'%';el.classList.toggle('off',!vis);el.dataset.side=rel>0?'r':'l';
  const txt=d<1000?`約 ${Math.round(d/10)*10} m`:`約 ${(d/1000).toFixed(1)} km`;
  if($('#lmD').textContent!==txt)$('#lmD').textContent=txt;
}
async function lmOpen(){
  const m=LM.list[LM.i];if(!m)return;
  const fill=()=>{$('#cImg').src=m.img||'';$('#cImg').hidden=!m.img;$('#cT').textContent=m.title;
    $('#cTx').textContent=m.extract||'読み込み中…';$('#cA').href=`https://${m.lang}.wikipedia.org/?curid=${m.id}`};
  $('#lmCard').hidden=false;fill();
  if(!m.extract){
    try{const j=await(await fetch(`https://${m.lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(m.title)}`)).json();m.extract=j.extract||'解説が見つかりませんでした'}
    catch(e){m.extract='解説を取得できませんでした'}
    if(LM.list[LM.i]===m)fill();
  }
}
function setLand(v){
  cfg.land=v;store(CK,cfg);$('#cLand').checked=v;
  if(v)landmarks();else{$('#lm').hidden=true;$('#lmCard').hidden=true}
  ok(v?'ランドマーク表示：オン':'ランドマーク表示：オフ');
}
$('#lm').onclick=e=>{e.stopPropagation();lmOpen()};
$('#cNext').onclick=()=>{if(LM.list.length){LM.i=(LM.i+1)%LM.list.length;LM.key='';lmOpen()}};
$('#cClose').onclick=()=>$('#lmCard').hidden=true;
$('#bLm').onclick=()=>setLand(!cfg.land);
$('#cLand').checked=cfg.land;$('#cLand').onchange=e=>setLand(e.target.checked);
if(cfg.awake===undefined)cfg.awake=true;
$('#cAwake').checked=cfg.awake&&'wakeLock' in navigator;
if(!('wakeLock' in navigator)){$('#cAwake').disabled=true;$('#cAwake').parentElement.append('（このブラウザでは非対応）')}
$('#cAwake').onchange=e=>{cfg.awake=e.target.checked;store(CK,cfg);cfg.awake?keepAwake():freeAwake();ok(cfg.awake?'画面を消灯させません':'画面の消灯を許可しました')};
$('#bPause').onclick=togglePause;$('#bExp').onclick=exportSaves;$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{if(e.target.files[0])importSaves(e.target.files[0]);e.target.value=''};
addEventListener('keyup',e=>{if(e.key===' '&&e.target.tagName!=='INPUT')e.preventDefault()});
renderList();requestAnimationFrame(loop);
const saved=localStorage.getItem(K);if(saved)loadMaps(saved);
</script>
